# Release: every push to main is analysed by semantic-release.
#   fix: → patch · feat: → minor · feat!: or "BREAKING CHANGE:" footer → major · anything else → no release
# It creates a git tag and a GitHub Release with notes. It never commits back to the repo.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the tag and the GitHub Release — nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # semantic-release reads the history since the last tag
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci   # exact versions from package-lock.json
      - run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
